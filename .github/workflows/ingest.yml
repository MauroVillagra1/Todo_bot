# Worker de ingesta: revisa las fuentes activas y guarda solo lo nuevo.
# Ver docs/ACTUALIZACIONES.md.
#
# Requiere el secret DATABASE_URL (Settings → Secrets and variables → Actions).
name: Ingesta

on:
  schedule:
    # 09:00 y 21:00 UTC = 06:00 y 18:00 en Argentina
    - cron: "0 9,21 * * *"
  workflow_dispatch:
    inputs:
      fuente:
        description: "Nombre exacto de una fuente (vacío = todas las activas)"
        required: false

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ingesta.txt

      - run: pip install -r requirements-ingesta.txt

      - name: Ejecutar ingesta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # El worker no firma tokens, pero Settings exige la variable
          SECRET_KEY: worker-sin-jwt
          ENVIRONMENT: production
          FUENTE: ${{ github.event.inputs.fuente }}
        run: |
          if [ -n "$FUENTE" ]; then
            python scripts/run_ingest.py --fuente "$FUENTE"
          else
            # Instagram se lee desde la PC local (scripts/instagram_local.ps1)
            python scripts/run_ingest.py --excluir-tipo INSTAGRAM
          fi
