# Worker de ingesta: revisa las fuentes activas y guarda solo lo nuevo.
# Ver docs/ACTUALIZACIONES.md.
#
# Requiere el secret DATABASE_URL (Settings → Secrets and variables → Actions).
name: Ingesta

on:
  schedule:
    # Cada 6 horas: 03, 09, 15 y 21 UTC = 00, 06, 12 y 18 en Argentina
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      fuente:
        description: "Nombre exacto de una fuente (vacío = todas las activas)"
        required: false

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ingesta.txt

      - run: pip install -r requirements-ingesta.txt

      - name: Ejecutar ingesta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Opcional: con la API key de Neon la corrida avisa si el cupo pasa del 80 %
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: org-rough-truth-00356190
          # El worker no firma tokens, pero Settings exige la variable
          SECRET_KEY: worker-sin-jwt
          ENVIRONMENT: production
          FUENTE: ${{ github.event.inputs.fuente }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret DATABASE_URL (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ -n "$FUENTE" ]; then
            python scripts/run_ingest.py --fuente "$FUENTE"
          else
            # Instagram se lee desde la PC local (scripts/instagram_local.ps1)
            python scripts/run_ingest.py --excluir-tipo INSTAGRAM
          fi
