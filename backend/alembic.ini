# Alembic configuration file
# Documentación: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Ruta al directorio de migraciones (relativo a este archivo)
script_location = alembic

# Plantilla para los nombres de archivo de migración
# %(rev)s → revisión, %(slug)s → descripción corta, %(epoch)s → timestamp
file_template = %%(epoch)s_%%(slug)s

# La URL real se lee desde env.py usando la variable DATABASE_URL del .env
# No poner credenciales aquí
sqlalchemy.url = 

# Timezone para los timestamps de los archivos de migración
timezone = UTC

# Nivel de logging de Alembic
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
